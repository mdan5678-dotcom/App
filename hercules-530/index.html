<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Hercules 5:30: a voice-guided 5-day muscle-building workout, nutrition, supplement, and progress coach.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hercules 5:30">
  <title>Hercules 5:30</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brandmark" aria-hidden="true">H</div>
    <div><strong>HERCULES 5:30</strong><small id="today-label">Loading today...</small></div>
    <button id="install-btn" class="icon-btn hidden" aria-label="Install app">Install</button>
  </header>

  <main id="app" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="App navigation">
    <button data-view="today" class="active"><span>NOW</span>Today</button>
    <button data-view="plan"><span>5D</span>Plan</button>
    <button data-view="fuel"><span>FOOD</span>Fuel</button>
    <button data-view="progress"><span>LOG</span>Progress</button>
    <button data-view="tools"><span>+</span>Tools</button>
  </nav>

  <section id="coach" class="coach hidden" aria-modal="true" role="dialog">
    <div class="coach-top">
      <button id="coach-close" class="ghost">Exit</button>
      <div><strong id="coach-day">Workout</strong><small id="coach-elapsed">00:00 / 48:00</small></div>
      <button id="voice-toggle" class="ghost">Voice On</button>
    </div>
    <div class="coach-body">
      <div class="coach-progress"><span id="coach-bar"></span></div>
      <p id="coach-phase" class="eyebrow">GET READY</p>
      <h1 id="coach-task">Workout begins shortly</h1>
      <p id="coach-cue" class="coach-cue">Use controlled form and stop for sharp pain, dizziness, chest symptoms, or unusual shortness of breath.</p>
      <div id="coach-clock" class="coach-clock">00:00</div>
      <p id="coach-next" class="next-up">Next: —</p>
      <div id="set-log" class="set-log hidden">
        <label>Weight<input id="log-weight" inputmode="decimal" placeholder="lb"></label>
        <label>Reps<input id="log-reps" inputmode="numeric" placeholder="reps"></label>
        <label>RIR<select id="log-rir"><option value="3">3</option><option value="2" selected>2</option><option value="1">1</option><option value="0">0</option></select></label>
        <button id="log-set" class="primary">Log set</button>
      </div>
      <div class="coach-controls">
        <button id="coach-back" class="ghost">Back</button>
        <button id="coach-pause" class="primary">Pause</button>
        <button id="coach-skip" class="ghost">Skip</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast hidden"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
